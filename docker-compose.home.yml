services:
  db:
    image: postgres:16-alpine
    container_name: melbourne-transit-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - melbourne-transit-radar-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    container_name: melbourne-transit-radar-app
    restart: unless-stopped
    env_file: .env.home
    environment:
      NODE_ENV: production
      PORT: "3000"
      MELBOURNE_TRAIN_DATABASE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${ACTIVE_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:14020:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  importer:
    build:
      context: .
      target: builder
    profiles: ["maintenance"]
    env_file: .env.home
    environment:
      MELBOURNE_TRAIN_DATABASE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${IMPORT_DATABASE}
    depends_on:
      db:
        condition: service_healthy

volumes:
  melbourne-transit-radar-postgres:
